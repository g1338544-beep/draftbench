# Records a how-to video in the running desktop app (Linux, under Xvfb): the Joint dialog
# clicked step by step for an air cylinder (examples/demo/joint_tutorial.py). Run by hand.
name: Draftbench tutorial

on:
  workflow_dispatch:
    inputs:
      tutorial:
        description: "joint (air cylinder, with voice) or clamp (toggle clamp, captions only)"
        default: clamp

permissions:
  contents: read

jobs:
  joint:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: draftbench-tutorial
          cache-on-failure: true
      - name: System packages
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runners' apt mirrors sometimes don't resolve: try for a while, then fall back to
          # what the image has, a static ffmpeg build and a Thai font fetched from GitHub.
          sudo timeout 420 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq || echo "apt update failed"
          sudo timeout 600 apt-get install -y -qq xvfb ffmpeg mesa-vulkan-drivers libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 fonts-thai-tlwg fonts-dejavu-core libgtk-3-0 || echo "apt install failed"
          if ! command -v ffmpeg; then
            curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ
            sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          fi
          if ! fc-list | grep -qiE "thai|sarabun|loma|garuda"; then
            mkdir -p ~/.fonts
            for w in Regular Bold; do curl -sSL -o ~/.fonts/Sarabun-$w.ttf https://github.com/google/fonts/raw/main/ofl/sarabun/Sarabun-$w.ttf; done
            fc-cache -f
          fi
          command -v Xvfb ffmpeg
      - name: Thai voice-over
        if: inputs.tutorial == 'joint'
        run: |
          pip install --quiet edge-tts gTTS
          sudo apt-get install -y -qq espeak-ng
          mkdir -p out
          python3 examples/demo/voice.py speak out
      - name: Build the app and the CLI
        run: cargo build --release -p solidcraft -p solidcraft-cli
      - name: Record
        env:
          SOLIDCRAFT_CONTROL_TOKEN: 6a1f3c9e8b7d2a4f5e6c7b8a9d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a
        run: |
          mkdir -p out
          if [ "${{ inputs.tutorial }}" = clamp ]; then
            PARTS=toggle-clamp-parts; export TUTORIAL=clamp_tutorial.py NAME=clamp-tutorial
          else
            PARTS=cylinder-parts
          fi
          target/release/solidcraft-cli run examples/motion/$PARTS.json --out out/$PARTS.draftnew
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:99 target/release/solidcraft --control 7878 > out/app.log 2>&1 &
          for i in $(seq 1 120); do python3 -c "import sys;sys.path.insert(0,'examples/demo');from enclosure_mcp import control;r=control(7878,'ui.inspect');sys.exit(0 if r.get('ok') else 1)" 2>/dev/null && break; sleep 1; done
          DISPLAY=:99 examples/demo/record_tutorial.sh :99 7878 out out/$PARTS.draftnew
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-tutorial
          path: out/
