# Builds the example designs in examples/ with the CLI and records their motion: the design file,
# a GIF and an MP4 of the cam turning, as an artifact and a pre-release. Run by hand.
name: Draftbench example

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cam:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: draftbench-example
      - name: Build the CLI
        run: cargo build --release -p solidcraft-cli
      - name: Build the motion examples and record them
        run: |
          mkdir -p out
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          CLI=target/release/solidcraft-cli
          for f in examples/motion/*.json; do
            case "$f" in *.anim.json) continue;; esac
            n=$(basename "$f" .json)
            echo "== $n"
            if ! $CLI run "$f" --out "out/$n.draftnew" --results > "out/$n.build.json" 2>&1; then cat "out/$n.build.json"; echo "FAILED $n" >> out/failed.txt; continue; fi
            if ! $CLI run "examples/motion/$n.anim.json" --in "out/$n.draftnew" --results > "out/$n.anim.out.json" 2>&1; then cat "out/$n.anim.out.json"; echo "FAILED anim $n" >> out/failed.txt; continue; fi
            ffmpeg -loglevel error -y -i "out/$n.gif" -filter_complex "[0:v]scale=trunc(iw/2)*2:trunc(ih/2)*2,split[a][b];[b]reverse[r];[a][r]concat=n=2:v=1,loop=2:size=32767" -movflags +faststart -pix_fmt yuv420p "out/$n.mp4"
          done
          ls -la out
          cat out/failed.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cam-example
          path: out/
      - name: Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="examples-${GITHUB_SHA::7}"
          ls out/*.draftnew out/*.gif out/*.mp4 >/dev/null 2>&1 || exit 1
          gh release create "$tag" out/*.draftnew out/*.gif out/*.mp4 --prerelease --title "Motion examples ($tag)" --notes "Built from examples/motion/*.json: open a .draftnew file and drag the moving part." --target "$GITHUB_SHA"
