# Builds the Draftbench desktop app for Windows (draftbench-windows.zip artifact and a
# pre-release on GitHub Releases). Run by hand: Actions -> Draftbench Windows -> Run workflow.
name: Draftbench Windows

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        # The commit goes into the app (top right, next to the version), so which build is running is plain to see.
        run: DRAFTBENCH_BUILD="${GITHUB_SHA::7}" cargo build --profile release-pc -p solidcraft
      - name: Package
        shell: pwsh
        run: |
          # The commit is in the file names, so a new download never has the same name as an old one.
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          New-Item -ItemType Directory -Path pack | Out-Null
          Copy-Item target/release-pc/solidcraft.exe "pack/DraftNew-$sha.exe"
          Compress-Archive -Path pack/* -DestinationPath "draftbench-windows-$sha.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: draftbench-windows
          path: draftbench-windows-*.zip
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="windows-${GITHUB_SHA::7}"
          gh release create "$tag" "draftbench-windows-${GITHUB_SHA::7}.zip" --prerelease --title "DraftNew for Windows ($tag)" --notes "Desktop build of ${GITHUB_SHA::7}. Unzip and run DraftNew-${GITHUB_SHA::7}.exe." --target "$GITHUB_SHA"
