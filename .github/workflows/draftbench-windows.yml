# Builds the Draftbench desktop app for Windows (draftbench-windows.zip artifact and a
# pre-release on GitHub Releases). Run by hand: Actions -> Draftbench Windows -> Run workflow.
name: Draftbench Windows

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build and package (installer, portable zip, plain exe)
        shell: pwsh
        # The commit goes into the app (top right, next to the version), so which build is running is plain to see.
        run: |
          $env:DRAFTBENCH_BUILD = $env:GITHUB_SHA.Substring(0, 7)
          ./packaging/windows/package.ps1 -Arch x64
      - name: Name the files
        shell: pwsh
        run: |
          # The commit is in the file names, so a new download never has the same name as an old one.
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          New-Item -ItemType Directory -Path pack | Out-Null
          Copy-Item dist/release/*.msi "pack/DraftNew-$sha-installer.msi"
          Copy-Item dist/release/*-portable.zip "pack/DraftNew-$sha-portable.zip"
          Copy-Item dist/release/*.exe "pack/DraftNew-$sha.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: draftbench-windows
          path: pack/*
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="windows-${GITHUB_SHA::7}"
          gh release create "$tag" pack/* --prerelease --title "DraftNew for Windows ($tag)" --notes "Desktop build of ${GITHUB_SHA::7}. Installer: DraftNew-${GITHUB_SHA::7}-installer.msi. No install: unzip DraftNew-${GITHUB_SHA::7}-portable.zip, or run DraftNew-${GITHUB_SHA::7}.exe alone." --target "$GITHUB_SHA"
