# Builds the electric-car example (examples/ev/car.py -> car.json) with the CLI and uploads the design and renders.
name: EV car

on:
  workflow_dispatch:
  push:
    paths: ['examples/ev/**', '.github/workflows/ev-car.yml']

jobs:
  car:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI
        run: cargo build --release -p solidcraft-cli
      - name: Debug - bodies after the first steps
        run: |
          mkdir -p out
          for n in 19; do
            LIMIT=$n python3 examples/ev/car.py out/prefix.json
            ./target/release/solidcraft-cli run out/prefix.json --save out/prefix$n.solidcraft --allow-errors 2>&1 | tee -a out/run.log || true
            ./target/release/solidcraft-cli eval out/prefix$n.solidcraft --json-out out/prefix$n-eval.json 2>&1 | tee -a out/run.log || true
            python3 -c "import json;d=json.load(open('out/prefix$n-eval.json'));print('STEP $n bodies:',[ (b.get('name'),b.get('volume_mm3')) for b in d['bodies']], d['bodies'][:1], [ (t['name'],t['error']) for t in d['timeline']])" 2>&1 | tee -a out/run.log || true
          done
      - name: Flange drawing - do the centre lines come out?
        run: |
          mkdir -p out
          ./target/release/solidcraft-cli run examples/ev/flange.json --allow-errors --results --json-out out/flange-results.json 2>&1 | tee -a out/run.log || true
          ls out | tee -a out/run.log
          grep -c CENTER out/flange.dxf | tee -a out/run.log || true
          grep -c LWPOLYLINE out/flange.dxf | tee -a out/run.log || true
          head -c 1500 out/flange-results.json | tee -a out/run.log || true
      - name: Make the script
        run: python3 examples/ev/car.py examples/ev/car.json
      - name: Run it
        run: |
          mkdir -p out
          ./target/release/solidcraft-cli run examples/ev/car.json --save out/electric-car.solidcraft --results --allow-errors --json-out out/results.json 2>&1 | tee -a out/run.log || true
      - name: Snapshots
        run: |
          for v in iso front right top back; do
            ./target/release/solidcraft-cli snapshot out/electric-car.solidcraft --view $v --out out/$v.png --width 1400 --height 900 --no-grid 2>&1 | tee -a out/run.log || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ev-car
          path: out
