name: Draft check
on:
  push:
    branches: [draft-check]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p solidcraft-cli
      - run: |
          mkdir -p out
          ./target/release/solidcraft-cli run examples/ev/scale-check.json --allow-errors 2>&1 | grep -i error | head
          python3 - <<'PY'
          L=open('out/flange.dxf',errors='ignore').read().split('\n')
          pairs=[(L[i].strip(),L[i+1].strip()) for i in range(0,len(L)-1,2)]
          ents=[];cur=None
          for c,v in pairs:
              if c=='0':
                  if cur: ents.append(cur)
                  cur={'t':v,'v':[]}
              elif cur is not None: cur['v'].append((c,v))
          if cur: ents.append(cur)
          for e in ents:
              d=dict((c,v) for c,v in e['v'])
              if e['t']=='LINE' and d.get('20') and 200<float(d['20'])<290 and d.get('20')==d.get('21'):
                  print('H', d.get('8'), round(float(d['10']),1), round(float(d['11']),1), 'y', round(float(d['20']),1))
          PY
