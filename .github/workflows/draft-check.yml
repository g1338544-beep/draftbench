name: Draft check
on:
  push:
    branches: [draft-check]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p solidcraft-cli
      - run: |
          mkdir -p out
          ./target/release/solidcraft-cli run examples/ev/scale-check.json --results --allow-errors 2>&1 | grep -E "error" | head
          grep -c . out/d.dxf out/e.dxf || true
          for f in out/d.dxf out/e.dxf; do echo $f; grep -a -c CENTER $f; grep -a -E "TOP |RIGHT " $f | head -4; done
          grep -a -E 'TOP|RIGHT' out/d.dxf out/e.dxf | head
