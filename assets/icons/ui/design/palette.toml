# Same accessibility adjustments as the application's semantic UI tokens.
# Protan/Deutan share red-green; Tritan uses blue-yellow. Unlisted roles keep their ramp.
[variants.red-green.sketch.active-3]
light = "#1d7d52"
dark  = "#1d7f89"
# A brighter orange keeps construction distinct from constraint red under both
# red-green loss simulations; the approved normal-vision ramp stays unchanged.
[variants.red-green.construction.active-3]
light = "#b97300"
dark  = "#a75d00"
# The constraint red stays darker than the sketch green for a weak red sense.
[variants.red-green.constraint.active-3]
light = "#af4038"
dark  = "#c16358"
[variants.blue-yellow.construction.active-3]
light = "#b97300"
dark  = "#c37d00"
[variants.blue-yellow.constraint.active-3]
light = "#af4038"
dark  = "#85554a"

# Default accent by requested icon id. Explicit alias accents in aliases.toml win.
