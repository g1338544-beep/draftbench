# Icon colour roles. Artwork in svg/ uses the stable source hex values below (or `currentColor`
# for the `line` role); the generator maps each identifier to its role and the app resolves the role to the
# value for the active theme. `source` is the stable SVG identifier; edit only light/dark
# display values or accent ramps to recolour finished artwork without modifying SVGs.
# Dark theme: outlines become light and passive faces keep their shading order.
# Accent entries match the corresponding blue entry's OKLab lightness in both themes.
# Non-blue dotted/dashed references use roles.guide, without workspace overrides.
# Active blue source strokes retain their semantic accent, including dashed results.

[roles.ink]        # outlines and details drawn over a face
source = "#34465b"
light = "#34465b"
dark  = "#1f2021"
[roles.line]       # line art that sits directly on the UI background (SVG: currentColor)
source = "#34465b"
light = "#34465b"
dark  = "#dbe4ee"
[roles.passive-1]  # passive geometry, lightest face
source = "#e2e8ef"
light = "#e2e8ef"
dark  = "#8da3c3"
[roles.passive-2]
source = "#b8c3cf"
light = "#b8c3cf"
dark  = "#6d81a2"
[roles.passive-3]  # darkest passive face
source = "#8e9faf"
light = "#8e9faf"
dark  = "#546782"
[roles.gap]        # erases earlier artwork to transparency; light/dark retained for legacy schema only
source = "#ffffff"
light = "#ffffff"
dark  = "#1e2530"
[roles.guide]      # construction and guide dots
source = "#6f879c"
light = "#6f879c"
dark  = "#8093a4"
[roles.active-1]   # changed or result geometry, palest face
source = "#b9ddf8"
light = "#bcdcf6"
dark  = "#7f9db6"
[roles.active-2]
source = "#328bd3"
light = "#3584cf"
dark  = "#3786d1"
[roles.active-3]   # strongest blue: strokes and accents
source = "#236ead"
light = "#d06a00"
dark  = "#b55100"

[strokes]          # on the 64 grid
geometry = 2.55
action = 4.25
navigation = 5.6
parameters = 4.2

# Accent colours. An accent replaces the roles it lists (normally the three `active-*` blues), so
# an icon keeps its drawing and only changes colour: "extrude" in the Solid accent and
# "surface_extrude" (see aliases.toml) are the same artwork in orange. Roles an accent does not
# list keep their base value. Edit hex values here; nothing else needs to change.
# Shared accent definitions: Solid uses the base palette (blue faces, orange cue); Surface uses orange,
# Form purple, Mesh yellow, Sketch green, constraints red and Sketch construction orange.
# This is the single colour authority for SVGs, semantic UI tokens and the review page.
# Active-3 is the primary stroke; active-1/2 preserve face shading. SVG source hexes
# above are stable role identifiers: change these accent ramps, not accepted artwork.

[accents.surface.active-1]
light = "#f8d6ad"
dark  = "#b3936c"
[accents.surface.active-2]
light = "#e08a1e"
dark  = "#be6b00"
[accents.surface.active-3]
light = "#1f66b0"
dark  = "#2e74bf"
# Mixed-colour scheme (owner's choice A2): each ribbon group has its own face colour, and its
# action cue (active-3: arrows, result strokes) takes a contrasting colour. Base (Create): blue
# faces with an orange cue.
[accents.modify.active-1]
light = "#bfe6e6"
dark  = "#7ca1a1"
[accents.modify.active-2]
light = "#2a9a9a"
dark  = "#219494"
[accents.modify.active-3]
light = "#d06a00"
dark  = "#b55100"

[accents.pattern.active-1]
light = "#decff8"
dark  = "#9f91b7"
[accents.pattern.active-2]
light = "#9567e2"
dark  = "#9264df"
[accents.pattern.active-3]
light = "#1f66b0"
dark  = "#2e74bf"

[accents.construct.active-1]
